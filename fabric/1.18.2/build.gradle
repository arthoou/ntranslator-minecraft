plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'idea'
    id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
    id 'com.gradleup.shadow' version '8.3.6'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(project.java_version as int)

repositories {
    mavenCentral()
}

configurations {
    shade
    implementation.extendsFrom(shade)
}

loom {
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    shade "org.jetbrains.kotlin:kotlin-stdlib:${project.kotlin_version}"
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        loader_version         : loader_version,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = Integer.parseInt(project.java_version)
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = project.java_version
    }
}

java {
    withSourcesJar()
}

jar {
    archiveVersion = project.display_version.toString().replace(' ', '-')
    archiveClassifier = 'dev-slim'
}

tasks.named('sourcesJar').configure {
    archiveVersion = project.display_version.toString().replace(' ', '-')
}

shadowJar {
    archiveVersion = project.display_version.toString().replace(' ', '-')
    archiveClassifier = 'dev-shadow'
    configurations = [project.configurations.shade]
    relocate 'kotlin', 'com.arthou.ntranslator.shadow.kotlin'
    exclude 'module-info.class'
    exclude 'META-INF/versions/**'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
}

remapJar {
    dependsOn shadowJar
    inputFile.set(shadowJar.archiveFile)
    archiveVersion = project.display_version.toString().replace(' ', '-')
    archiveClassifier = ''
}

tasks.build.dependsOn(tasks.remapJar)
